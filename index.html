<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafetería La Distingancia - Menú Digital</title>
    <!-- Tailwind CSS para un diseño limpio y moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans pb-24">

    <!-- Encabezado -->
    <header class="bg-amber-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold">☕ Cafetería La Distingancia</h1>
                <p class="text-amber-100 text-sm">¡El sabor que marca la diferencia!</p>
            </div>
            <button onclick="toggleCartModal()" class="relative bg-amber-700 hover:bg-amber-800 px-4 py-2 rounded-full flex items-center gap-2 transition">
                <i class="fa-solid fa-cart-shopping"></i>
                <span id="cart-count" class="bg-white text-amber-800 font-bold px-2 py-0.5 rounded-full text-xs">0</span>
            </button>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="max-w-4xl mx-auto px-4 py-6">
        
        <!-- Filtros de Categorías -->
        <div class="flex gap-2 overflow-x-auto pb-4 mb-6 scrollbar-none">
            <button onclick="filterCategory('all')" class="category-btn active px-4 py-2 bg-amber-600 text-white rounded-full text-sm font-medium whitespace-nowrap transition">Todos</button>
            <button onclick="filterCategory('picaderas')" class="category-btn px-4 py-2 bg-white text-gray-600 border border-gray-200 rounded-full text-sm font-medium whitespace-nowrap hover:bg-gray-100 transition">Picaderas</button>
            <button onclick="filterCategory('bebidas')" class="category-btn px-4 py-2 bg-white text-gray-600 border border-gray-200 rounded-full text-sm font-medium whitespace-nowrap hover:bg-gray-100 transition">Bebidas</button>
            <button onclick="filterCategory('desayunos')" class="category-btn px-4 py-2 bg-white text-gray-600 border border-gray-200 rounded-full text-sm font-medium whitespace-nowrap hover:bg-gray-100 transition">Desayunos</button>
        </div>

        <!-- Listado de Productos -->
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <!-- Los productos se cargan dinámicamente desde JavaScript -->
        </div>

    </main>

    <!-- Modal del Carrito / Resumen de Pedido -->
    <div id="cart-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex justify-end">
        <div class="bg-white w-full max-w-md h-full flex flex-col shadow-xl">
            <div class="p-4 bg-amber-600 text-white flex justify-between items-center">
                <h2 class="text-lg font-bold"><i class="fa-solid fa-bag-shopping mr-2"></i> Tu Pedido</h2>
                <button onclick="toggleCartModal()" class="text-white hover:text-gray-200 text-xl font-bold">&times;</button>
            </div>
            
            <div id="cart-items" class="p-4 flex-1 overflow-y-auto divide-y divide-gray-100">
                <!-- Productos agregados -->
            </div>

            <div class="p-4 bg-gray-50 border-t border-gray-200">
                <div class="mb-3">
                    <label class="block text-xs font-bold text-gray-600 mb-1">Nombre del cliente:</label>
                    <input type="text" id="customer-name" placeholder="Ej. Juan Pérez" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                </div>
                <div class="mb-4">
                    <label class="block text-xs font-bold text-gray-600 mb-1">Dirección de entrega o nota:</label>
                    <input type="text" id="customer-address" placeholder="Ej. Calle Principal #12" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                </div>
                <div class="flex justify-between items-center mb-4 text-lg font-bold">
                    <span>Total:</span>
                    <span id="cart-total" class="text-amber-600">$0.00</span>
                </div>
                <button onclick="checkoutWhatsApp()" class="w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded-xl font-bold flex items-center justify-center gap-2 shadow-md transition">
                    <i class="fa-brands fa-whatsapp text-xl"></i> Enviar Pedido por WhatsApp
                </button>
            </div>
        </div>
    </div>

    <!-- Script de lógica -->
    <script>
        // Configuración del número de WhatsApp del negocio (agrega tu número con código de país, sin '+' ni espacios)
        const WHATSAPP_NUMBER = "18090000000"; 

        // Base de datos de productos (puedes agregar o modificar fácilmente)
        const products = [
            { id: 1, name: "quipe de Res", category: "picaderas", price: 75, description: "Crujiente por fuera y jugoso por dentro.", image: "https://images.unsplash.com/photo-1541529086526-db283c563270?w=500&auto=format&fit=crop&q=60" },
            { id: 2, name: "Empanada de Pollo", category: "picaderas", price: 60, description: "Masa crujiente rellena de pollo sazonado.", image: "https://images.unsplash.com/photo-1601050690597-df0568f70950?w=500&auto=format&fit=crop&q=60" },
            { id: 3, name: "Café Negrito", category: "bebidas", price: 40, description: "Café colado tradicional bien caliente.", image: "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=500&auto=format&fit=crop&q=60" },
            { id: 4, name: "Jugo Natural de Chinola", category: "bebidas", price: 90, description: "Refrescante jugo natural de temporada.", image: "https://images.unsplash.com/photo-1613478223719-2ab802602423?w=500&auto=format&fit=crop&q=60" },
            { id: 5, name: "Mangú con Tres Golpes", category: "desayunos", price: 250, description: "Mangú de plátano con salami, queso frito y huevos.", image: "https://images.unsplash.com/photo-1533089860892-a7c6f0a88666?w=500&auto=format&fit=crop&q=60" }
        ];

        let cart = [];

        // Renderizar productos al iniciar
        function renderProducts(filter = 'all') {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = '';

            const filtered = filter === 'all' ? products : products.filter(p => p.category === filter);

            filtered.forEach(product => {
                grid.innerHTML += `
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col justify-between">
                        <img src="${product.image}" alt="${product.name}" class="w-full h-36 object-cover">
                        <div class="p-4 flex-1 flex flex-col justify-between">
                            <div>
                                <h3 class="font-bold text-gray-800">${product.name}</h3>
                                <p class="text-xs text-gray-500 mt-1 mb-2">${product.description}</p>
                            </div>
                            <div class="flex items-center justify-between mt-2">
                                <span class="text-amber-600 font-bold">$${product.price.toFixed(2)}</span>
                                <button onclick="addToCart(${product.id})" class="bg-amber-100 text-amber-800 hover:bg-amber-600 hover:text-white px-3 py-1.5 rounded-lg text-sm font-semibold transition">
                                    <i class="fa-solid fa-plus"></i> Agregar
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // Filtrar por categoría
        function filterCategory(category) {
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('bg-amber-600', 'text-white');
                btn.classList.add('bg-white', 'text-gray-600', 'border', 'border-gray-200');
            });
            event.target.classList.remove('bg-white', 'text-gray-600', 'border', 'border-gray-200');
            event.target.classList.add('bg-amber-600', 'text-white');

            renderProducts(category);
        }

        // Funciones del Carrito
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const existing = cart.find(item => item.id === productId);

            if (existing) {
                existing.quantity++;
            } else {
                cart.push({ ...product, quantity: 1 });
            }

            updateCartUI();
        }

        function updateQuantity(productId, change) {
            const item = cart.find(i => i.id === productId);
            if (item) {
                item.quantity += change;
                if (item.quantity <= 0) {
                    cart = cart.filter(i => i.id !== productId);
                }
            }
            updateCartUI();
        }

        function updateCartUI() {
            const countElem = document.getElementById('cart-count');
            const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            countElem.innerText = totalCount;

            const itemsContainer = document.getElementById('cart-items');
            itemsContainer.innerHTML = '';

            if (cart.length === 0) {
                itemsContainer.innerHTML = `<p class="text-center text-gray-400 py-8 text-sm">Tu carrito está vacío</p>`;
            } else {
                cart.forEach(item => {
                    itemsContainer.innerHTML += `
                        py-3 flex justify-between items-center">
                            <div>
                                <h4 class="text-sm font-bold text-gray-800">${item.name}</h4>
                                <p class="text-xs text-amber-600 font-semibold">$${item.price} x ${item.quantity}</p>
                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="updateQuantity(${item.id}, -1)" class="w-7 h-7 bg-gray-200 rounded-full font-bold text-sm">-</button>
                                <span class="text-sm font-bold">${item.quantity}</span>
                                <button onclick="updateQuantity(${item.id}, 1)" class="w-7 h-7 bg-gray-200 rounded-full font-bold text-sm">+</button>
                            </div>
                        </div>
                    `;
                });
            }

            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            document.getElementById('cart-total').innerText = `$${total.toFixed(2)}`;
        }

        function toggleCartModal() {
            const modal = document.getElementById('cart-modal');
            modal.classList.toggle('hidden');
        }

        // Enviar pedido estructurado a WhatsApp
        function checkoutWhatsApp() {
            if (cart.length === 0) {
                alert("Agrega al menos un producto a tu pedido.");
                return;
            }

            const name = document.getElementById('customer-name').value.trim();
            const address = document.getElementById('customer-address').value.trim();

            if (!name) {
                alert("Por favor ingresa tu nombre.");
                return;
            }

            let message = `*¡Nuevo Pedido - Cafetería La Distingancia!* ☕\n\n`;
            message += `👤 *Cliente:* ${name}\n`;
            if (address) message += `📍 *Dirección/Nota:* ${address}\n`;
            message += `\n*Detalle del pedido:*\n`;

            cart.forEach(item => {
                message += `- ${item.quantity}x ${item.name} ($${(item.price * item.quantity).toFixed(2)})\n`;
            });

            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            message += `\n*Total a pagar:* $${total.toFixed(2)}`;

            const encodedMessage = encodeURIComponent(message);
            const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodedMessage}`;
            window.open(url, '_blank');
        }

        // Carga inicial
        renderProducts();
    </script>
</body>
</html>
