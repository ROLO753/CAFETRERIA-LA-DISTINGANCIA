<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Volante animado | La Distingancia</title><style>
html{font-size:calc(100vw/54)}*{box-sizing:border-box}body{margin:0;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;text-align:center;color:#fff;font-family:"Segoe UI",Arial,sans-serif;background:#241a16;overflow:hidden;position:relative}
#bg{position:absolute;inset:0}#fx{position:absolute;inset:0;overflow:hidden}.e{position:absolute;left:0;top:0;line-height:1;will-change:transform}
.top,.mid,.bot{position:relative;z-index:2;padding:0 3rem}
.tag{display:inline-block;padding:.5rem 1.6rem;border-radius:3rem;background:#e2b77f40;color:#ffd9a0;font-weight:800;letter-spacing:.12em;font-size:1.5rem}
h1{margin:1rem 0 .3rem;font:700 4.4rem/1.05 Georgia,serif;text-shadow:0 .3rem 1.2rem #0009}h1 small{display:block;font:600 2.4rem Georgia,serif;color:#ffd9a0;margin-bottom:.4rem}
.lead{margin:.6rem 0 0;font-size:2rem;color:#f4e9df;text-shadow:0 .2rem .8rem #000a}
.qrwrap{position:relative;display:inline-block}.ring{position:absolute;inset:0;border-radius:2rem;border:.35rem solid #ffd9a0;opacity:0}
.qr{position:relative;display:inline-block;padding:1.6rem;border-radius:2rem;background:#fff;box-shadow:0 1.2rem 3rem #000a}.qr img{display:block;width:21rem;height:21rem}
.cta{margin:1.4rem 0 0;font-size:2.4rem;font-weight:800;text-shadow:0 .2rem .8rem #000a}.cta b{color:#ffd9a0}.cta i{display:inline-block;font-style:normal}
.cats{display:flex;flex-wrap:wrap;justify-content:center;gap:.7rem}.cats span{display:inline-block;padding:.5rem 1.1rem;border-radius:2rem;background:#00000040;backdrop-filter:blur(3px);font-weight:800;font-size:1.5rem}
.wa{position:relative;overflow:hidden;margin-top:1.2rem;display:inline-block;padding:.9rem 2.4rem;border-radius:3rem;background:#25a85a;font-weight:800;font-size:1.8rem;box-shadow:0 .5rem 1.5rem #0007}.shine{position:absolute;top:0;bottom:0;width:30%;background:linear-gradient(100deg,transparent,#ffffff77,transparent);left:-40%}
.url{margin-top:.8rem;font-size:1.25rem;color:#f0dcc4;text-shadow:0 .1rem .5rem #000}
body.square .qr img{width:17rem;height:17rem}body.square h1{font-size:3.6rem}body.square .cats{display:none}
</style></head><body>
<canvas id="bg"></canvas><div id="fx"></div>
<div class="top"><span class="tag" id="tag">🔥 HECHO CON SABOR</span><h1 id="h1"><small>Cafetería</small>La Distingancia</h1><p class="lead" id="lead">Hamburguesas · Sandwiches · Yaroas · Picaderas · Bebidas</p></div>
<div class="mid"><div class="qrwrap" id="qrw"><div class="ring" id="ring"></div><div class="qr"><img src="qr-menu.svg" alt="Código QR del menú"></div></div><p class="cta" id="cta"><i id="phone">📲</i> <b>Escanea</b> y mira el menú</p></div>
<div class="bot"><div class="cats" id="cats"><span>🍔 Hamburguesas</span><span>🥪 Sandwiches</span><span>🌯 Yaroas</span><span>🍟 Picaderas</span><span>🥤 Batidas</span></div><div class="wa" id="wa">💬 Pide fácil por WhatsApp · 🛵 Delivery<div class="shine" id="shine"></div></div><div class="url">rolo753.github.io/CAFETRERIA-LA-DISTINGANCIA</div></div>
<script>
const D=10,TAU=Math.PI*2,$=id=>document.getElementById(id);
if(location.hash.includes('cuadrado'))document.body.classList.add('square');
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const W=innerWidth,H=innerHeight,R=rng(7),em=['🍔','🍔','🍔','🥪','🥪','🍟','🍟','🥤','☕','🍗','🌯','🥟','🍕','🍿','🥓'],fx=$('fx'),els=[];
const layers=[{n:14,s:[.05,.075],o:.4,b:3,k:[1]},{n:12,s:[.08,.115],o:.75,b:1,k:[1,2]},{n:7,s:[.12,.17],o:1,b:0,k:[1,2]}];
layers.forEach((L,li)=>{for(let i=0;i<L.n;i++){const d=document.createElement('div');d.className='e';d.textContent=em[Math.floor(R()*em.length)];const size=W*(L.s[0]+R()*(L.s[1]-L.s[0]));d.style.fontSize=size+'px';d.style.opacity=L.o;d.style.filter=(L.b?`blur(${L.b}px) `:'')+`drop-shadow(0 ${size*.08}px ${size*.1}px #000a)`;fx.appendChild(d);els.push({d,size,x0:R()*W,ph:R(),k:L.k[Math.floor(R()*L.k.length)],a:W*(.02+R()*.05),m:1+Math.floor(R()*2),rot:8+R()*25,sp:1+Math.floor(R()*2),dir:li===0?1:-1})}});
const cv=$('bg'),cx=cv.getContext('2d');cv.width=W;cv.height=H;
const ease=x=>1-Math.pow(1-Math.min(1,Math.max(0,x)),3),back=x=>{x=Math.min(1,Math.max(0,x));const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
function intro(t,s,l){return back((t-s)/l)}
function render(t){
 const u=t/D;
 cx.clearRect(0,0,W,H);
 const g=cx.createLinearGradient(0,0,W*Math.sin(u*TAU)*.3+W*.5,H);g.addColorStop(0,'#2a1c15');g.addColorStop(.5,'#603b2a');g.addColorStop(1,'#241a16');cx.fillStyle=g;cx.fillRect(0,0,W,H);
 for(const [px,py,c,r,ph] of [[.2,.15,'#c58a52',.6,0],[.85,.85,'#e2873a',.55,.5],[.5,.5,'#8a4a1f',.7,.25]]){const x=W*(px+.08*Math.sin(TAU*(u+ph))),y=H*(py+.06*Math.cos(TAU*(u+ph))),rg=cx.createRadialGradient(x,y,0,x,y,Math.max(W,H)*r);rg.addColorStop(0,c+'88');rg.addColorStop(1,c+'00');cx.fillStyle=rg;cx.fillRect(0,0,W,H)}
 els.forEach(e=>{const span=H+e.size*2,y=H+e.size-(((u*e.k+e.ph)%1+1)%1)*span*(e.dir>0?1:1),x=e.x0+e.a*Math.sin(TAU*(u*e.m+e.ph)),r=e.rot*Math.sin(TAU*(u*e.sp+e.ph)),sc=1+.12*Math.sin(TAU*(u*2+e.ph*3));e.d.style.transform=`translate(${x-e.size/2}px,${y}px) rotate(${r}deg) scale(${sc})`});
 const pop=(el,s,l,from=0)=>{const v=intro(t,s,l);el.style.opacity=Math.min(1,Math.max(0,(t-s)/.25));el.style.transform=`translateY(${(1-v)*from}px) scale(${.4+.6*v})`};
 pop($('tag'),.1,.7,-60);pop($('h1'),.35,.9,-40);$('lead').style.opacity=Math.min(1,Math.max(0,(t-.9)/.4));
 const qv=intro(t,1.0,.9),fl=Math.sin(TAU*u*2)*.012;$('qrw').style.opacity=Math.min(1,Math.max(0,(t-1)/.2));$('qrw').style.transform=`translateY(${Math.sin(TAU*u*3)*.5}rem) scale(${(.3+.7*qv)*(1+fl)}) rotate(${(1-qv)*-8}deg)`;
 const rp=((u*4)%1);$('ring').style.opacity=t<1.8?0:(1-rp)*.9;$('ring').style.transform=`scale(${1+rp*.35})`;
 pop($('cta'),1.7,.6,30);$('phone').style.transform=`rotate(${Math.sin(TAU*u*5)*14}deg) translateY(${Math.abs(Math.sin(TAU*u*5))*-.4}rem)`;
 const cs=[...$('cats').children];cs.forEach((c,i)=>{const st=2+i*.18,v=intro(t,st,.6);c.style.opacity=Math.min(1,Math.max(0,(t-st)/.2));c.style.transform=`translateY(${(1-v)*2.5+Math.sin(TAU*(u*3+i*.2))*-.25}rem) scale(${.5+.5*v})`});
 pop($('wa'),2.9,.6,40);const wp=((u*4)%1);$('shine').style.left=(-40+wp*190)+'%';$('wa').style.transform+=` scale(${1+.03*Math.sin(TAU*u*4)})`;
}
render(0);
let start=null;if(!location.hash.includes('frame')){requestAnimationFrame(function f(ts){if(start===null)start=ts;render(((ts-start)/1000)%D);requestAnimationFrame(f)})}
</script>
</body></html>
