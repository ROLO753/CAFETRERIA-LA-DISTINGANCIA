<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Volante | La Distingancia</title><style>
html{font-size:calc(100vw/54)}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;text-align:center;color:#fff;font-family:"Segoe UI",Arial,sans-serif;background:radial-gradient(circle at 20% 10%,#8a4a1f,transparent 45%),radial-gradient(circle at 90% 90%,#c58a52,transparent 40%),linear-gradient(160deg,#241a16,#603b2a);overflow:hidden;position:relative}
.bg span{position:absolute;font-size:5rem;opacity:.18}.bg span:nth-child(1){left:5%;top:4%;transform:rotate(-15deg)}.bg span:nth-child(2){right:6%;top:9%;transform:rotate(12deg)}.bg span:nth-child(3){left:7%;bottom:6%;transform:rotate(10deg)}.bg span:nth-child(4){right:5%;bottom:5%;transform:rotate(-12deg)}.bg span:nth-child(5){left:44%;top:2%}
.top,.mid,.bot{position:relative;z-index:1;padding:0 3rem}
.tag{display:inline-block;padding:.5rem 1.6rem;border-radius:3rem;background:#e2b77f33;color:#ffd9a0;font-weight:800;letter-spacing:.12em;font-size:1.5rem}
h1{margin:1rem 0 .3rem;font:700 4.4rem/1.05 Georgia,serif}h1 small{display:block;font:600 2.4rem Georgia,serif;color:#ffd9a0;margin-bottom:.4rem}
.lead{margin:.6rem 0 0;font-size:2rem;color:#f4e9df}
.qr{display:inline-block;padding:1.6rem;border-radius:2rem;background:#fff;box-shadow:0 1.2rem 3rem #0008}.qr img{display:block;width:21rem;height:21rem}
.cta{margin:1.4rem 0 0;font-size:2.4rem;font-weight:800}.cta b{color:#ffd9a0}
.cats{display:flex;flex-wrap:wrap;justify-content:center;gap:.7rem}.cats span{padding:.5rem 1.1rem;border-radius:2rem;background:#ffffff1f;font-weight:800;font-size:1.5rem}
.wa{margin-top:1.2rem;display:inline-block;padding:.9rem 2.4rem;border-radius:3rem;background:#25a85a;font-weight:800;font-size:1.8rem}
.url{margin-top:.8rem;font-size:1.25rem;color:#e9d5bd;word-break:break-all}
body.square .cats{display:none}body.square .qr img{width:17rem;height:17rem}body.square h1{font-size:3.6rem}body.square .bg span{font-size:4rem}
</style></head><body>
<div class="bg" aria-hidden="true"><span>🍔</span><span>🥪</span><span>🍟</span><span>🥤</span><span>☕</span></div>
<div class="top"><span class="tag">🔥 HECHO CON SABOR</span><h1><small>Cafetería</small>La Distingancia</h1><p class="lead">Hamburguesas · Sandwiches · Yaroas · Picaderas · Bebidas</p></div>
<div class="mid"><div class="qr"><img src="qr-menu.svg" alt="Código QR del menú"></div><p class="cta">📲 <b>Escanea</b> y mira el menú</p></div>
<div class="bot"><div class="cats"><span>🍔 Hamburguesas</span><span>🥪 Sandwiches</span><span>🌯 Yaroas</span><span>🍟 Picaderas</span><span>🥤 Batidas</span></div><div class="wa">💬 Pide fácil por WhatsApp · 🛵 Delivery</div><div class="url">rolo753.github.io/CAFETRERIA-LA-DISTINGANCIA</div></div>
<script>if(location.hash==='#cuadrado')document.body.classList.add('square')</script>
</body></html>
