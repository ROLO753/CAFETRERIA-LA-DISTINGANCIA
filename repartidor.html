<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#241a16"><title>Repartidor | La Distingancia</title><style>
:root{--ink:#241a16;--deep:#39251c;--coffee:#603b2a;--cream:#fbf7f0;--line:#e9dfd3;--muted:#766b63;--green:#237a4b;--red:#a33b2f}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.5 "Segoe UI",Arial,sans-serif}button{font:inherit}.top{padding:16px 18px;color:#fff;background:linear-gradient(120deg,#39251c,#603b2a,#c58a52)}.top h1{margin:0;font:700 1.4rem Georgia,serif}.wrap{max-width:720px;margin:auto;padding:14px}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.kpi{padding:10px;border-radius:12px;background:#fff;border:1px solid var(--line);text-align:center}.kpi small{display:block;color:var(--muted)}.kpi strong{font-size:1.15rem;color:var(--green)}h2{font:700 1.2rem Georgia,serif;margin:18px 0 8px}.card{padding:14px;margin:10px 0;border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:0 6px 18px #603b2a18}.card.route{border-color:#0e7490}.card h3{margin:0 0 4px}.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.78rem;font-weight:800;color:#fff;background:#d97706}.badge.encamino{background:#0e7490}.badge.entregado{background:#237a4b}.card p{margin:6px 0}.items{margin:6px 0;padding-left:20px}.pay{padding:8px 10px;border-radius:10px;background:#fff2d9;color:#60441f;font-weight:700}.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.btn{flex:1;min-width:140px;min-height:46px;padding:10px;border:0;border-radius:10px;background:var(--deep);color:#fff;font-weight:800;text-align:center;text-decoration:none;cursor:pointer}.btn.go{background:#0e7490}.btn.ok{background:var(--green)}.btn.map{background:#e6f4ea;color:#14532d}.btn:disabled{opacity:.6}.msg{padding:18px;text-align:center;background:#fff;border-radius:12px;color:var(--muted)}.msg.err{color:var(--red)}[hidden]{display:none!important}
</style></head><body><header class="top"><h1>🛵 Panel del repartidor</h1><small>La Distingancia</small></header><main class="wrap"><div class="kpis" id="kpis" hidden><div class="kpi"><small>Pendientes</small><strong id="k-pending">0</strong></div><div class="kpi"><small>Entregas de hoy</small><strong id="k-done">0</strong></div><div class="kpi"><small>Ganancia de hoy</small><strong id="k-earn">RD$ 0</strong></div></div><div id="status" class="msg">Cargando tus pedidos…</div><section id="pending-box" hidden><h2>📦 Por entregar</h2><div id="pending"></div></section><section id="done-box" hidden><h2>✅ Entregados recientemente</h2><div id="done"></div></section></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="firebase-config.js"></script><script>
const token=new URLSearchParams(location.search).get('t')||'',statusBox=document.getElementById('status');
const money=n=>'RD$ '+Number(n||0).toLocaleString('es-DO');
function el(tag,text,cls){const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x}
if(!/^[a-f0-9]{32}$/.test(token)){statusBox.textContent='Enlace no válido. Pide tu enlace de repartidor a la cafetería.';statusBox.classList.add('err')}else{
const db=firebase.initializeApp(window.CAFETERIA_FIREBASE_CONFIG).database();let known=null;
async function setStatus(id,state,button){if(state==='entregado'&&!confirm('¿Confirmas que ya entregaste este pedido?'))return;button.disabled=true;try{await db.ref(`driverOrders/${token}/${id}/status`).set(state)}catch(error){console.error(error);alert('No se pudo actualizar el pedido. Revisa tu conexión.');button.disabled=false}}
function card(o){const c=el('article',undefined,'card'+(o.status==='encamino'?' route':''));const head=el('div');head.append(el('span',o.status==='encamino'?'En camino':o.status==='entregado'?'Entregado':'Nuevo',`badge ${o.status}`));c.append(head,el('h3',o.clientName||'Cliente'),el('p','📍 '+(o.address||'Sin dirección')));
if(o.status!=='entregado'){const row=el('div',undefined,'row');const lat=Number(o.location&&o.location.lat),lng=Number(o.location&&o.location.lng);const map=el('a','🗺️ Abrir en el mapa','btn map');map.target='_blank';map.rel='noopener noreferrer';map.href=Number.isFinite(lat)&&Number.isFinite(lng)?`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(o.address||'')}`;row.appendChild(map);c.append(row)}
const list=el('ul',undefined,'items');(o.items||[]).forEach(i=>list.appendChild(el('li',`${i.qty} × ${i.name}`)));c.appendChild(list);
c.appendChild(el('div',o.paymentMethod==='efectivo'?`💵 Cobrar ${money(o.total)}${o.cashAmount?` · paga con ${o.cashAmount}`:''}`:`🏦 Transferencia · total ${money(o.total)}. Confirma el pago con la cafetería.`,'pay'));c.appendChild(el('p',`Tu ganancia por este envío: ${money(o.delivery)}`));
if(o.status!=='entregado'){const row=el('div',undefined,'row');if(o.status==='asignado'){const go=el('button','🛵 Salí con el pedido','btn go');go.onclick=()=>setStatus(o.id,'encamino',go);row.appendChild(go)}const ok=el('button','✅ Entregado','btn ok');ok.onclick=()=>setStatus(o.id,'entregado',ok);row.appendChild(ok);c.appendChild(row)}return c}
db.ref('driverOrders/'+token).on('value',snapshot=>{const list=Object.values(snapshot.val()||{}).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));const pending=list.filter(o=>o.status!=='entregado'),done=list.filter(o=>o.status==='entregado');const start=new Date();start.setHours(0,0,0,0);const today=done.filter(o=>Number(o.createdAt)>=start.getTime());
document.getElementById('kpis').hidden=false;document.getElementById('k-pending').textContent=pending.length;document.getElementById('k-done').textContent=today.length;document.getElementById('k-earn').textContent=money(today.reduce((s,o)=>s+(Number(o.delivery)||0),0));
statusBox.hidden=!!list.length;statusBox.classList.remove('err');statusBox.textContent='Todavía no tienes pedidos asignados. Esta pantalla se actualiza sola.';
const p=document.getElementById('pending'),d=document.getElementById('done');p.replaceChildren(...pending.map(card));d.replaceChildren(...done.slice(0,15).map(card));document.getElementById('pending-box').hidden=!pending.length;document.getElementById('done-box').hidden=!done.length;
const ids=new Set(pending.map(o=>o.id));if(known&&[...ids].some(id=>!known.has(id))){if(navigator.vibrate)navigator.vibrate([200,100,200]);document.title='🔔 Nuevo pedido | Repartidor';setTimeout(()=>document.title='Repartidor | La Distingancia',6000)}known=ids},error=>{console.error(error);statusBox.hidden=false;statusBox.classList.add('err');statusBox.textContent='No se pudieron cargar tus pedidos. Revisa tu conexión o pide un enlace nuevo.'})}
</script></body></html>
